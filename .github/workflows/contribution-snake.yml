name: Update contribution snake

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/contribution-snake.yml
      - scripts/embed-contribution-snake.py
      - README.md

permissions:
  contents: read

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Generate the contribution snake for the black profile card
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/contribution-snake.svg?palette=github-dark&color_snake=#c5ff4a

      - name: Embed the animation in the profile card
        run: python3 scripts/embed-contribution-snake.py dist/contribution-snake.svg assets/profile-card.svg

      - name: Update the profile image
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-card.svg
          if git diff --cached --quiet; then
            echo "The contribution snake is already up to date."
            exit 0
          fi
          git commit -m "chore: update profile contribution snake"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
